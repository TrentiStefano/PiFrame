name: pi_frame
description: A new Flutter project.
publish_to: none
version: 1.1.0
environment:
  sdk: ^3.13.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  web_socket_channel: ^3.0.1
  http: ^1.2.1
  window_manager: ^0.5.1
  pi_frame_protocol:
    path: ../../packages/pi_frame_protocol
  pi_frame_theme:
    path: ../../packages/pi_frame_theme
  file_selector: ^1.1.0
  url_launcher: ^6.3.3
  local_notifier: ^0.1.6
  desktop_drop: ^0.8.4
  path: ^1.9.0
  xterm: ^4.0.0
  qr_flutter: ^4.1.0
  ffi: ^2.2.0
  webview_win_floating: ^3.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/themes/
    - assets/branding/
  fonts:
    - family: SchibstedGrotesk
      fonts:
        - asset: assets/fonts/SchibstedGrotesk.ttf
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
    - family: SourceCodePro
      fonts:
        - asset: assets/fonts/SourceCodePro.ttf
