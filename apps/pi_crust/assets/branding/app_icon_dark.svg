<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Diffused Natural Floor Shadow (macOS style, zero neon glow) -->
    <filter id="cohesiveShadowDark" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Top Filling Surface: Lighter, smooth matte surface -->
    <linearGradient id="fillingTopDark" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3d4155"/>
      <stop offset="100%" stop-color="#4c5169"/>
    </linearGradient>

    <!-- Filling Cut Face (Right): Interior pie filling cross-section -->
    <linearGradient id="fillingCutRightDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#363a4e"/>
      <stop offset="100%" stop-color="#2d3042"/>
    </linearGradient>

    <!-- Cohesive 1-Piece Crust: Visibly DARKER than the filling -->
    <linearGradient id="crustBackWallDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2d3d"/>
      <stop offset="50%" stop-color="#232634"/>
      <stop offset="100%" stop-color="#1e202e"/>
    </linearGradient>

    <linearGradient id="crustBottomSlabDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262938"/>
      <stop offset="100%" stop-color="#1a1c27"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Canvas: Catppuccin Frappe Base -->
  <rect width="512" height="512" rx="112" fill="#303446"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#51576d" stroke-width="1.5" opacity="0.6"/>

  <!-- Soft Diffused Floor Ambient Shadow under entire pie slice -->
  <ellipse cx="258" cy="408" rx="156" ry="36" fill="#000000" opacity="0.44" filter="url(#cohesiveShadowDark)"/>

  <g filter="url(#cohesiveShadowDark)">
    <!-- ================================================================= -->
    <!-- 1. BACK CURVED CRUST WALL (Seamlessly connects to bottom crust)    -->
    <!-- Top rim: (140, 180) to (390, 192), Bottom: (140, 255) to (390, 267) -->
    <!-- ================================================================= -->
    <path d="M 140 180 Q 265 120 390 192 V 267 Q 265 195 140 255 Z"
          fill="url(#crustBackWallDark)" stroke="#363a4e" stroke-width="1.5"/>

    <!-- Subtle vertical crimp lines along back crust wall -->
    <g stroke="#181a24" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
      <line x1="172" y1="168" x2="172" y2="240"/>
      <line x1="206" y1="150" x2="206" y2="222"/>
      <line x1="244" y1="140" x2="244" y2="212"/>
      <line x1="284" y1="138" x2="284" y2="210"/>
      <line x1="324" y1="148" x2="324" y2="220"/>
      <line x1="360" y1="168" x2="360" y2="240"/>
    </g>

    <!-- Raised Fluted Crimp Rim (Rises 12px above filling along back arc) -->
    <path d="M 140 180 
             C 148 168, 162 160, 172 162
             C 182 150, 198 144, 208 146
             C 220 136, 236 132, 246 134
             C 258 130, 274 130, 284 134
             C 296 136, 312 142, 322 148
             C 334 150, 350 158, 358 166
             C 370 172, 382 182, 390 192
             Q 265 122 140 180 Z"
          fill="#363a4e" stroke="#4c5169" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Soft highlight pips on each crimp lobe crest -->
    <g fill="#a5adce" opacity="0.55">
      <circle cx="172" cy="162" r="2.5"/>
      <circle cx="208" cy="146" r="2.5"/>
      <circle cx="246" cy="134" r="2.5"/>
      <circle cx="284" cy="134" r="2.5"/>
      <circle cx="322" cy="148" r="2.5"/>
      <circle cx="358" cy="166" r="2.5"/>
    </g>

    <!-- ================================================================= -->
    <!-- 2. FOREGROUND CUT WALLS (Filling + Cohesive Bottom Crust Layer)    -->
    <!-- ================================================================= -->

    <!-- LEFT CUT WALL (In perspective shadow) -->
    <!-- Filling upper portion -->
    <path d="M 220 320 L 140 180 V 235 L 220 375 Z"
          fill="#1c1e2b" stroke="#2a2d3d" stroke-width="1"/>
    <!-- Bottom crust layer portion (connects seamlessly to back crust at 140, 255) -->
    <path d="M 220 375 L 140 235 V 255 L 220 395 Z"
          fill="#141520" stroke="#1c1e2b" stroke-width="1"/>

    <!-- RIGHT CUT WALL (Facing viewer) -->
    <!-- Filling upper portion: from (220, 320) to (390, 192) down to seam (390, 247) and (220, 375) -->
    <path d="M 220 320 L 390 192 V 247 L 220 375 Z"
          fill="url(#fillingCutRightDark)" stroke="#3d4155" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- BOTTOM CRUST LAYER: 1-piece base under the pie slice -->
    <!-- Connects at (390, 247) to (390, 267) seamlessly meeting back crust wall! -->
    <path d="M 220 375 L 390 247 V 267 L 220 395 Z"
          fill="url(#crustBottomSlabDark)" stroke="#232634" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Subtle texture demarcation between filling and bottom crust -->
    <line x1="222" y1="375" x2="388" y2="247" stroke="#232634" stroke-width="1.5"/>

    <!-- Leading Edge Chamfer Bevel Highlight (from top apex to bottom apex) -->
    <line x1="220" y1="320" x2="220" y2="395" stroke="#51576d" stroke-width="2" stroke-linecap="round"/>

    <!-- ================================================================= -->
    <!-- 3. TOP PIE FILLING FACET (Lighter, smooth surface)               -->
    <!-- Apex: (220, 320), Left: (140, 180), Right: (390, 192)            -->
    <!-- ================================================================= -->
    <path d="M 220 320 L 140 180 Q 265 120 390 192 Z"
          fill="url(#fillingTopDark)" stroke="#51576d" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Bevel highlight edges along facet sides -->
    <line x1="220" y1="320" x2="140" y2="180" stroke="#626880" stroke-width="1.2"/>
    <line x1="220" y1="320" x2="390" y2="192" stroke="#626880" stroke-width="1.2"/>

    <!-- Single Refined Mauve Pinstripe along Inner Crust Rim Seam -->
    <path d="M 144 182 Q 265 124 386 194" fill="none" stroke="#ca9ee6" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="220" cy="320" r="3.5" fill="#ca9ee6"/>

    <!-- ================================================================= -->
    <!-- 4. OFFICIAL PI CODING AGENT LOGO — PERFECTLY CENTERED             -->
    <!-- Center of facet: (248, 230). 33px margin left & right.           -->
    <!-- True 3D perspective matrix alignment:                            -->
    <!-- ================================================================= -->
    <g transform="matrix(0.38, 0.018, -0.062, 0.232, 248, 230)">
      <!-- Official Pi-Coding-Agent Logo in High-Contrast Text Highlight -->
      <path d="M -105 -105 H 52.5 V 0 H 0 V 52.5 H -52.5 V 105 H -105 Z M -52.5 -52.5 V 0 H 0 V -52.5 Z"
            fill="#c6d0f5" fill-rule="evenodd"/>
      <path d="M 52.5 0 H 105 V 105 H 52.5 Z"
            fill="#c6d0f5"/>
    </g>
  </g>
</svg>
