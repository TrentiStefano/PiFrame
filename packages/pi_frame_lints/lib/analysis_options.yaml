# The shared analyzer options. The app and the Dart packages include this file from their analysis_options.yaml and
# depend on this package as a dev dependency. Changing it is a guarded change: it needs the human-approved label.
# Warnings and infos are counted by the diagnostics ratchet (tools/guardrails/src/diagnostics.mjs), so a new one fails
# the gate; see docs/pr-verification.md ("Diagnostics ratchet").
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_print: true
    discarded_futures: true
    unawaited_futures: true

formatter:
  page_width: 120
