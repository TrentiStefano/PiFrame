name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing SemVer tag to rebuild and attach installers to
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate All Suites
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.25.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev libnotify-dev libwebkit2gtk-4.1-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check synchronized versions
        run: pnpm run check:version

      - name: Build TypeScript packages
        run: pnpm -r run build

      - name: Build daemon bundle
        run: pnpm --filter @piframe/agentd run build:bundle

      - name: Verify and smoke-test daemon bundle
        run: |
          pnpm run check:agentd-bundle
          pnpm run smoke:agentd-bundle

      - name: Run Node tests
        run: |
          pnpm -r run test
          node --test tools/scripts/test-windows-release-name.test.mjs

      - name: Run Flutter tests and analyzers
        run: |
          cd packages/pi_frame_protocol && flutter test
          cd ../pi_frame_theme && flutter test
          cd ../../apps/pi_frame && flutter analyze && flutter test

  release-please:
    name: Prepare semantic release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-meta:
    name: Resolve build version
    if: always() && needs.validate.result == 'success' && (needs.release-please.result == 'success' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    needs: [release-please, validate]
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.version.outputs.should_build }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: bash
        env:
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${MANUAL_TAG#v}"
            tag="v$version"
            should_build=true
          elif [[ "$RELEASE_CREATED" == "true" ]]; then
            version="$RELEASE_VERSION"
            tag="$RELEASE_TAG"
            should_build=true
          else
            version=""
            tag=""
            should_build=false
          fi
          if [[ "$should_build" == "true" && ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release version: $version" >&2
            exit 1
          fi
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-release:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }} installer
    if: needs.release-meta.outputs.should_build == 'true'
    needs: [release-meta, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
          - os: macos-15-intel
            platform: macos
            arch: x64
          - os: macos-15
            platform: macos
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      APP_VERSION: ${{ needs.release-meta.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-meta.outputs.tag }}

      - uses: pnpm/action-setup@v5
        with:
          version: 10.25.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev libnotify-dev libwebkit2gtk-4.1-dev xvfb imagemagick

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build protocol package
        run: pnpm --filter @piframe/pcp-ts run build

      - name: Build daemon bundle
        run: pnpm --filter @piframe/agentd run build:bundle

      - name: Build Flutter desktop app
        working-directory: apps/pi_frame
        run: flutter build ${{ matrix.platform }} --release --build-name ${{ needs.release-meta.outputs.version }} --build-number ${{ github.run_number }} --dart-define=PI_FRAME_VERSION=${{ needs.release-meta.outputs.version }}

      # The daemon serves this build for remote phone/browser access, so it must
      # ship inside the installer next to the daemon.
      - name: Build Flutter web app (remote access)
        working-directory: apps/pi_frame
        run: flutter build web --release --no-web-resources-cdn --dart-define=PI_FRAME_VERSION=${{ needs.release-meta.outputs.version }}

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'apps/pi_frame/build/windows/x64/runner/Release'
          if (!(Test-Path (Join-Path $bundle 'pi-agentd.cjs'))) {
            Copy-Item 'apps/agentd/dist/pi-agentd.cjs' $bundle
          }
          $nodePath = (Get-Command node).Source
          Copy-Item $nodePath (Join-Path $bundle 'node.exe') -Force
          Copy-Item 'apps/pi_frame/build/web' (Join-Path $bundle 'web') -Recurse -Force
          Copy-Item (Join-Path (Split-Path $nodePath -Parent) 'LICENSE') (Join-Path $bundle 'NODE-LICENSE.txt') -Force
          if (!(Test-Path (Join-Path $bundle 'PiFrame.exe')) -or !(Test-Path (Join-Path $bundle 'pi-agentd.cjs')) -or !(Test-Path (Join-Path $bundle 'node.exe')) -or !(Test-Path (Join-Path $bundle 'NODE-LICENSE.txt')) -or !(Test-Path (Join-Path $bundle 'web/index.html'))) {
            throw 'Windows app bundle is missing app, daemon, Node runtime, or remote web assets.'
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          choco install innosetup --yes --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DSourceDir=$bundle" "/DOutputDir=$env:GITHUB_WORKSPACE/dist" 'packaging/windows/piframe.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build macOS DMG
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          app='apps/pi_frame/build/macos/Build/Products/Release/pi_frame.app'
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist/dmg
          cp apps/agentd/dist/pi-agentd.cjs "$app/Contents/MacOS/pi-agentd.cjs"
          node_bin="$(command -v node)"
          cp "$node_bin" "$app/Contents/MacOS/node"
          cp "$(dirname "$(dirname "$node_bin")")/LICENSE" "$app/Contents/Resources/NODE-LICENSE.txt"
          chmod +x "$app/Contents/MacOS/node"
          rm -rf "$app/Contents/MacOS/web"
          cp -R apps/pi_frame/build/web "$app/Contents/MacOS/web"
          test -s "$app/Contents/MacOS/web/index.html"
          cp -R "$app" dist/dmg/PiFrame.app
          codesign --force --deep --sign - dist/dmg/PiFrame.app
          ln -s /Applications dist/dmg/Applications
          test -x "$app/Contents/MacOS/pi_frame"
          test -x "$app/Contents/MacOS/node"
          test -s "$app/Contents/MacOS/pi-agentd.cjs"
          test -s "$app/Contents/MacOS/web/index.html"
          test -s "$app/Contents/Resources/NODE-LICENSE.txt"
          hdiutil create -volname 'PiFrame' -srcfolder dist/dmg -ov -format UDZO "dist/PiFrame-${APP_VERSION}-macos-${{ matrix.arch }}.dmg"
          rm -rf dist/dmg

      - name: Build Linux Debian installer
        if: matrix.platform == 'linux'
        run: bash tools/scripts/package-linux-deb.sh "$APP_VERSION"

      - name: Capture README screenshot
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          package="dist/PiFrame-${APP_VERSION}-linux-amd64.deb"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          dpkg-deb --extract "$package" "$temp_dir"
          export PI_FRAME_HOME="$temp_dir/home"
          export APP_BIN="$temp_dir/opt/pi-frame/pi_frame"
          mkdir -p "$PI_FRAME_HOME"
          xvfb-run -a -s '-screen 0 1280x720x24' bash -c '
            "$APP_BIN" &
            app_pid=$!
            trap "kill $app_pid 2>/dev/null || true" EXIT
            for _ in $(seq 1 20); do
              [[ -s "$PI_FRAME_HOME/runtime/daemon.json" ]] && break
              sleep 0.5
            done
            test -s "$PI_FRAME_HOME/runtime/daemon.json"
            sleep 2
            import -window root "$GITHUB_WORKSPACE/dist/piframe-screenshot.png"
          '
          test -s dist/piframe-screenshot.png

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Attach installers to GitHub Release
    needs: [release-please, release-meta, build-release, validate]
    if: always() && needs.validate.result == 'success' && needs.build-release.result == 'success' && ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload installer assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-meta.outputs.tag }}" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
