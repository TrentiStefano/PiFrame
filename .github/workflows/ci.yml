name: CI

# The run steps below are the `ci` tier of the shared step list (tools/guardrails/src/steps.mjs), the same steps
# `pnpm run verify` runs locally. Change the step list first; a parity test fails when this file drifts from it.

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: Node.js (Lint, Test, Build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.25.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: TypeScript formatting (Prettier)
        run: node tools/scripts/format.mjs --check ts

      - name: Escape-hatch audit (baseline ratchet)
        run: node tools/scripts/audit-escape-hatches.mjs

      - name: Verify Pi target recon
        run: node tools/recon/verify.ts

      - name: PCP schema validation
        run: pnpm --filter @piframe/pcp-spec run test

      - name: Build TypeScript packages
        run: pnpm -r run build

      - name: TypeScript lint (tsc --noEmit)
        run: pnpm -r run lint

      - name: Codegen parity (schema, TypeScript, Dart)
        run: node tools/codegen/generate.js

      - name: Node tests (all packages)
        run: pnpm -r run test

      - name: Third-party notices up to date
        run: pnpm run check:notices

      - name: Version metadata synchronized
        run: pnpm run check:version

      - name: Daemon bundle contents
        run: pnpm run check:agentd-bundle

      - name: Daemon bundle smoke test
        run: pnpm run smoke:agentd-bundle

      - name: Windows release-name tests
        run: node --test tools/scripts/test-windows-release-name.test.mjs

  flutter:
    name: Flutter (Analyze & Test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'

      - name: Flutter dependencies
        run: node tools/scripts/setup-flutter.js

      - name: Dart formatting (dart format)
        run: node tools/scripts/format.mjs --check dart

      - name: Flutter analyze (all projects)
        run: node tools/scripts/lint-flutter.js

      - name: Flutter tests (all projects)
        run: node tools/scripts/test-flutter.js
